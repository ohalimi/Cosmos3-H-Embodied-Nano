    dtype: bfloat16
    enabled: false
    input_shape: null
    strict: true
  keys_not_to_resume: []
  keys_to_skip_loading: []
  load_ema_to_reg: false
  load_from_object_store:
    bucket: ''
    credentials: ''
    enabled: false
  load_path: <parent-checkpoint>
  load_training_state: true
  only_load_scheduler_state: false
  save_iter: 100
  save_to_object_store:
    bucket: ''
    credentials: ''
    enabled: false
  strict_resume: true
  type:
    _target_: dcp.DistributedCheckpointer
    callbacks: null
    disable_async: true
  verbose: true
  milestone_iters:
  - 46937
  - 46987
  - 47437
  save_final: true
